    <!-- Variable axis 200..1000: the UI reaches for font-black (900) in 61
         places, which a static set could only fake. Loaded here rather than via
         @import in CSS so the browser starts fetching immediately instead of
         waiting for the stylesheet to parse. Cairo is also the font embedded
         in the generated PDFs, so screen and print stay identical. -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet" />
