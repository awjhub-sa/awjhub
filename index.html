<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1E3A5F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>نصاب | لحلول الإعاشة</title>
    <!-- Tab icon renders at 16 px, where anything but the Arabic word is a
         smudge — so NSAB and the tagline are dropped rather than shrunk into
         noise. It carries its own navy field because a tab strip follows the
         reader's system theme, and navy ink on transparency would disappear
         against a dark one. The same badge serves the home screen, where an
         opaque icon is what iOS expects. -->
    <link rel="icon" type="image/svg+xml" href="/brand/icon-mark.svg" />
    <link rel="apple-touch-icon" href="/brand/icon-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded here rather than via @import in CSS so the browser starts
         fetching immediately instead of waiting for the stylesheet to parse.
         The print stylesheets name this same family, so screen and the
         browser-generated PDFs stay identical.

         The family stops at 700. The UI asks for 800 in ~138 places, which the
         browser resolves to this real 700 face rather than synthesising a
         faux-bold — measured identical advance widths at 700/800/900 — so those
         call sites render as true Bold and were left alone. Do not add a
         heavier request expecting a heavier result. -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- One variable drives every screen surface; everything else reads it. -->
    <style>:root { --font-arabic: 'IBM Plex Sans Arabic', Tahoma, sans-serif; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
